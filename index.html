<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔴 Bianca Live</title>
    <style>
        /* Reset de margens e paddings para garantir que não haja espaços */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Impede barras de rolagem */
        }
        
        /* Estilo para o iframe ocupar 100% da tela */
        .fullscreen-iframe {
            width: 100%;
            height: 100%;
            border: none; /* Remove a borda do iframe */
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <!-- Substitua a URL abaixo pela URL que deseja exibir no iframe -->
    <iframe 
        src="https://chat.bianca-grupinho.com/live" 
        class="fullscreen-iframe" 
        allowfullscreen
        title="Bianca Live">
    </iframe>
</body>
</html>
